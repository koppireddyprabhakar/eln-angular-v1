<main id="main" class="main">
  <!-- Page Title -->
  <div class="pagetitle">
    <h1>User Audit Logs</h1>
  </div>
  <!-- Filter Section -->
  <section class="section">
    <div class="row">
      <div class="col-lg-15">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-center">
            <div class="d-flex align-items-end gap-3 flex-wrap">
              <!-- From Date Input -->
              <div class="d-flex flex-column">
                <label for="fromDate" class="form-label mb-1">From Date</label>
                <input 
                  type="date" 
                  id="fromDate" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="fromDate" 
                  (ngModelChange)="filterAuditLogs()">
              </div>
              <!-- To Date Input -->
              <div class="d-flex flex-column">
                <label for="toDate" class="form-label mb-1">To Date</label>
                <input 
                  type="date" 
                  id="toDate" 
                  class="form-control form-control-sm" 
                  [(ngModel)]="toDate" 
                  (ngModelChange)="filterAuditLogs()">
              </div>
              <!-- User Select Input -->
              <div class="d-flex flex-column">
                <label for="userSelect" class="form-label mb-1">User</label>
                <select 
                  id="userSelect" 
                  class="form-select form-select-sm" 
                  [(ngModel)]="selectedUser" 
                  (ngModelChange)="filterAuditLogs()">
                  <option value="">All Users</option>
                  <option *ngFor="let user of users" [value]="user">{{ user }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Audit Report Section -->
  <section class="section mt-3">
    <div class="row">
      <div class="col-lg-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Audit Report</h5>
            <div class="table-responsive">
              <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>S.No</th>
                    <th>ID</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let log of filteredLogs; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ log.id }}</td>
                    <td>{{ log.userName }}</td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.createdDate | date: 'short' }}</td>
                  </tr>
                </tbody>
              </table>
              <div *ngIf="filteredLogs.length === 0" class="text-center mt-3 text-danger">
                No records found for the selected criteria.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
